[platformio]
default_envs = dev


[env]
framework = arduino
monitor_speed = 115200


; Configuração comum a todos os targets ESP8266
[esp8266]
platform = espressif8266
upload_speed = 921600
; Versao do Arduino ESP8266 com MDNS.queryHost()
;platform_packages =
;    framework-arduinoespressif8266 @ symlink:///home/gabriel/workspace/Arduino-esp8266
; Decisão de projeto:
; Todo firmware eTomada Lite para ESP8266 usa layout de flash de 1 MB,
; independentemente da capacidade física de flash da placa.
board_build.ldscript = eagle.flash.1m.ld

; LN882H:
; usa o layout padrão de 2 MB do LibreTiny/generic-ln882h,
; preservando as regiões nativas de APP, OTA e storage.
[ln882h]
platform = libretiny
upload_speed = 115200

; EKAZA-6Teclas:
[bk7231n]
platform = libretiny
upload_speed = 115200
;board = generic-bk7231n-qfn32-tuya
board = cbu

; EKAZA-3Teclas:
[bk7238]
platform = libretiny
upload_speed = 115200
board = t1-u


[env:dev]
extends = esp8266
board = esp12e
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
build_flags =
    -D HW_DEV


[env:mini01]
extends = esp8266
board = esp01_1m
; ESP8285 do Sonoff Mini R1 usa flash em modo DOUT
board_build.flash_mode = dout
build_flags =
    -D HW_SONOFF_MINIR1


[env:quarto]
extends = esp8266
board = d1_mini
upload_port = /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0
build_flags =
    -D HW_QUARTO


[env:cozy]
; extends = ln882h
platform = symlink:///home/gabriel/workspace/libretiny
board = generic-ln882h
build_flags =
    -D ETOMADA_LIBRETINY
    -D HW_COZY

[env:esp01]
extends = esp8266
board = esp01_1m
upload_port = /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A5069RR4-if00-port0
monitor_port = /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A5069RR4-if00-port0
build_flags =
    -D HW_ESP01

[env:sw6jantar]
extends = bk7231n
build_flags =
    -D ETOMADA_LIBRETINY
    -D HW_EKAZA_6TECLAS
    ;-D LT_UART_SILENT_ENABLED=0
    ;-D LT_LOGLEVEL=LT_LEVEL_DEBUG
    ;-D LT_DEBUG_MDNS=1
    ;-D LT_DEBUG_ALL=1
    ;-D LT_DEBUG_WIFI=1
    ;-D LT_LOG_HEAP=1
; Wifi só funcionou com o framework Beken v3.0.34, não com a versão que o libretiny usa v3.0.33
platform_packages =
    framework-beken-bdk @ https://github.com/libretiny-eu/framework-beken-bdk.git#3.0.34

[env:sw3jantar]
extends = bk7238
custom_options.sys_config#h =
    CFG_SUPPORT_BLE=0 ; Desabilitar Bluetooth - Causa erro de boot
build_flags =
    -D ETOMADA_LIBRETINY
    -D HW_EKAZA_3TECLAS
    -D LT_UART_DEFAULT_PORT=2
    -D LT_UART_SILENT_ENABLED=0
    -D LT_LOGLEVEL=LT_LEVEL_DEBUG
    -D LT_USE_TIME=1
